name: Temporary symbol choice learning validation

on:
  push:
    branches:
      - feature/symbol-choice-learning

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/symbol-choice-learning

      - name: Implement symbol-choice learning and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path("src/rewriter/user_segment_history_rewriter.cc")
          text = source.read_text(encoding="utf-8")
          old = '''void UserSegmentHistoryRewriter::Finish(const ConversionRequest& request,
                                                  const Segments& segments) {
            if (request.request_type() != ConversionRequest::CONVERSION) {
              return;
            }

            if (!IsAvailable(request, segments)) {
          '''
          new = '''void UserSegmentHistoryRewriter::Finish(const ConversionRequest& request,
                                                  const Segments& segments) {
            const bool is_prediction_or_suggestion =
                request.request_type() == ConversionRequest::PREDICTION ||
                request.request_type() == ConversionRequest::SUGGESTION ||
                request.request_type() == ConversionRequest::PARTIAL_PREDICTION ||
                request.request_type() == ConversionRequest::PARTIAL_SUGGESTION;
            if (request.request_type() != ConversionRequest::CONVERSION &&
                !is_prediction_or_suggestion) {
              return;
            }

            // Prediction/suggestion commits are normally learned by the predictor,
            // not by UserSegmentHistoryRewriter.  A user-selected symbol is a special
            // case: symbol candidate ordering is produced by rewriters, so without
            // recording the explicit choice here a live-conversion commit such as
            // choosing '/' for the '・' key never becomes a trigger for the next
            // symbol conversion.
            const bool learn_reranked_symbol_choice_only =
                request.request_type() != ConversionRequest::CONVERSION;

            if (!IsAvailable(request, segments)) {
          '''
          if old not in text:
              raise SystemExit("Finish() prologue not found")
          text = text.replace(old, new, 1)

          old = '''  const Segments target_segments =
              UseInnerSegments(request)
                  ? MakeLearningSegmentsFromInnerSegments(request, segments)
                  : segments;
          '''
          new = '''  const Segments target_segments =
              UseInnerSegments(request) && !learn_reranked_symbol_choice_only
                  ? MakeLearningSegmentsFromInnerSegments(request, segments)
                  : segments;
          '''
          if old not in text:
              raise SystemExit("target_segments block not found")
          text = text.replace(old, new, 1)

          old = '''    if (segment.candidates_size() <= 0 ||
                segment.segment_type() != Segment::FIXED_VALUE ||
                segment.candidate(0).attributes &
                    converter::Attribute::NO_HISTORY_LEARNING) {
              continue;
            }
            const size_t value_begin = committed_value.size();
          '''
          new = '''    if (segment.candidates_size() <= 0 ||
                segment.segment_type() != Segment::FIXED_VALUE ||
                segment.candidate(0).attributes &
                    converter::Attribute::NO_HISTORY_LEARNING) {
              continue;
            }

            if (learn_reranked_symbol_choice_only &&
                (!(segment.candidate(0).attributes &
                   converter::Attribute::RERANKED) ||
                 segment.candidate(0).category != converter::Candidate::SYMBOL)) {
              continue;
            }

            const size_t value_begin = committed_value.size();
          '''
          if old not in text:
              raise SystemExit("Finish() segment filter not found")
          text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")

          test_path = Path("src/rewriter/user_segment_history_rewriter_test.cc")
          tests = test_path.read_text(encoding="utf-8")
          new_tests = textwrap.dedent(r'''

          TEST_F(UserSegmentHistoryRewriterTest, LearnsSlashForMiddleDotSymbolKey) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest convreq = CreateConversionRequest();
            auto init_symbol_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("・");

              converter::Candidate* middle_dot = segment->add_candidate();
              middle_dot->key = "・";
              middle_dot->content_key = "・";
              middle_dot->value = "・";
              middle_dot->content_value = "・";
              middle_dot->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* slash = segment->add_candidate();
              slash->key = "・";
              slash->content_key = "・";
              slash->value = "/";
              slash->content_value = "/";
              slash->category = converter::Candidate::SYMBOL;
            };

            init_symbol_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(convreq, segments);

            init_symbol_candidates();
            EXPECT_TRUE(rewriter->Rewrite(convreq, &segments));
            EXPECT_EQ(segments.segment(0).candidate(0).value, "/");
            EXPECT_TRUE(segments.segment(0).candidate(0).attributes &
                        converter::Attribute::USER_SEGMENT_HISTORY_REWRITER);
          }

          TEST_F(UserSegmentHistoryRewriterTest,
                 LearnsRerankedSymbolChoiceFromPredictionCommit) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest prediction_request =
                ConversionRequestBuilder()
                    .SetConfig(*config_)
                    .SetRequest(*request_)
                    .SetOptions({.request_type = ConversionRequest::PREDICTION})
                    .Build();

            auto init_symbol_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("・");

              converter::Candidate* middle_dot = segment->add_candidate();
              middle_dot->key = "・";
              middle_dot->content_key = "・";
              middle_dot->value = "・";
              middle_dot->content_value = "・";
              middle_dot->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* slash = segment->add_candidate();
              slash->key = "・";
              slash->content_key = "・";
              slash->value = "/";
              slash->content_value = "/";
              slash->category = converter::Candidate::SYMBOL;
            };

            init_symbol_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(prediction_request, segments);

            init_symbol_candidates();
            EXPECT_TRUE(rewriter->Rewrite(prediction_request, &segments));
            EXPECT_EQ(segments.segment(0).candidate(0).value, "/");
          }

          TEST_F(UserSegmentHistoryRewriterTest,
                 DoesNotLearnNonSymbolFromPredictionCommit) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest prediction_request =
                ConversionRequestBuilder()
                    .SetConfig(*config_)
                    .SetRequest(*request_)
                    .SetOptions({.request_type = ConversionRequest::PREDICTION})
                    .Build();

            auto init_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("test");

              converter::Candidate* first = segment->add_candidate();
              first->key = "test";
              first->content_key = "test";
              first->value = "first";
              first->content_value = "first";
              first->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* second = segment->add_candidate();
              second->key = "test";
              second->content_key = "test";
              second->value = "second";
              second->content_value = "second";
            };

            init_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(prediction_request, segments);

            init_candidates();
            rewriter->Rewrite(prediction_request, &segments);
            EXPECT_EQ(segments.segment(0).candidate(0).value, "first");
          }
          ''')
          marker = "\n}  // namespace mozc\n"
          if "LearnsSlashForMiddleDotSymbolKey" not in tests:
              if marker not in tests:
                  raise SystemExit("namespace marker not found")
              tests = tests.replace(marker, new_tests + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run targeted history test
        working-directory: src
        run: bazelisk test //rewriter:user_segment_history_rewriter_test -c dbg

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-symbol-choice-learning.yml
          git rm -f .github/tmp-symbol-learning-trigger.txt || true
          git add src/rewriter/user_segment_history_rewriter.cc src/rewriter/user_segment_history_rewriter_test.cc
          git commit -m "Learn explicit symbol choices from live conversion"
          git push origin HEAD:feature/symbol-choice-learning
