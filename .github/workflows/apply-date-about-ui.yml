name: Apply date and About UI patch

on:
  push:
    branches:
      - feature/date-format-list-about-updater

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/date-format-list-about-updater
          fetch-depth: 1

      - name: Apply exact source changes
        run: python .github/scripts/apply-date-about-ui.py

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff --stat
          grep -n "date_conversion_custom_formats" src/protocol/config.proto src/rewriter/date_rewriter.cc src/gui/config_dialog/config_dialog.cc
          grep -n "checkUpdateButton\|updateButton" src/gui/about_dialog/about_dialog.ui src/gui/about_dialog/about_dialog.cc

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol/config.proto src/rewriter/date_rewriter.cc src/rewriter/date_rewriter_test.cc src/gui/config_dialog/config_dialog.ui src/gui/config_dialog/config_dialog.cc src/gui/about_dialog/about_dialog.ui src/gui/about_dialog/about_dialog.cc
          git commit -m "Add ordered date formats and About updater"
          git push origin HEAD:feature/date-format-list-about-updater
