name: Apply date and About UI patch

on:
  push:
    branches:
      - feature/date-format-list-about-updater

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/date-format-list-about-updater
          fetch-depth: 0

      - name: Apply exact source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Keep the v0.1.0 single value for compatibility, and add an ordered list.
          replace_once(
              'src/protocol/config.proto',
              '''  // Preferred custom format for date conversion candidates.\n  // Accepts {YEAR}, {MONTH}, and {DATE}. Built-ins remain available.\n  optional string date_conversion_custom_format = 1026 [default = ""];''',
              '''  // Preferred custom format for date conversion candidates.\n  // Accepts {YEAR}, {MONTH}, and {DATE}. Built-ins remain available.\n  // Kept for compatibility with v0.1.0.\n  optional string date_conversion_custom_format = 1026 [default = ""];\n\n  // Ordered preferred date formats. Earlier entries are inserted before later\n  // entries in the conversion candidate list. If empty, the legacy single\n  // date_conversion_custom_format field above is used.\n  repeated string date_conversion_custom_formats = 1027;''')

          # 2) Rewriter consumes the ordered list without reversing it.
          replace_once(
              'src/rewriter/date_rewriter.cc',
              '''  if (!request.config().date_conversion_custom_format().empty()) {\n    extra_date_formats.insert(\n        extra_date_formats.begin(),\n        ConvertExtraFormat(request.config().date_conversion_custom_format()));\n  }''',
              '''  if (request.config().date_conversion_custom_formats_size() > 0) {\n    std::vector<std::string> configured_formats;\n    configured_formats.reserve(\n        request.config().date_conversion_custom_formats_size());\n    for (const std::string &format :\n         request.config().date_conversion_custom_formats()) {\n      if (!format.empty()) {\n        configured_formats.push_back(ConvertExtraFormat(format));\n      }\n    }\n    extra_date_formats.insert(extra_date_formats.begin(),\n                              configured_formats.begin(),\n                              configured_formats.end());\n  } else if (!request.config().date_conversion_custom_format().empty()) {\n    extra_date_formats.insert(\n        extra_date_formats.begin(),\n        ConvertExtraFormat(request.config().date_conversion_custom_format()));\n  }''')

          # 3) Regression test: multiple configured formats keep UI order.
          replace_once(
              'src/rewriter/date_rewriter_test.cc',
              '''TEST_F(DateRewriterTest, NumberRewriterTest) {''',
              '''TEST_F(DateRewriterTest, AtokStyleMultipleCustomFormatsPreserveOrder) {\n  ClockMock mock_clock(ParseTimeOrDie("2026-09-08T12:00:00Z"));\n  Clock::SetClockForUnitTest(&mock_clock);\n\n  Segments segments;\n  DateRewriter rewriter;\n  auto table = std::make_shared<composer::Table>();\n  const commands::Request command_request;\n  config::Config config;\n  config.add_date_conversion_custom_formats("{YEAR}.{MONTH}.{DATE}");\n  config.add_date_conversion_custom_formats("{YEAR}_{MONTH}_{DATE}");\n  const composer::Composer composer(table, command_request, config);\n  const ConversionRequest request = ConversionRequestBuilder()\n                                        .SetComposer(composer)\n                                        .SetConfig(config)\n                                        .Build();\n\n  InitSegment("9/8", "9/8", &segments);\n  EXPECT_TRUE(rewriter.Rewrite(request, &segments));\n  ASSERT_GE(segments.segment(0).candidates_size(), 4);\n  EXPECT_EQ(segments.segment(0).candidate(0).value, "9/8");\n  EXPECT_EQ(segments.segment(0).candidate(1).value, "2026.09.08");\n  EXPECT_EQ(segments.segment(0).candidate(2).value, "2026_09_08");\n  EXPECT_EQ(segments.segment(0).candidate(3).value, "2026/09/08");\n\n  InitSegment("きょう", "今日", &segments);\n  EXPECT_TRUE(rewriter.Rewrite(request, &segments));\n  ASSERT_GE(segments.segment(0).candidates_size(), 4);\n  EXPECT_EQ(segments.segment(0).candidate(1).value, "2026.09.08");\n  EXPECT_EQ(segments.segment(0).candidate(2).value, "2026_09_08");\n  EXPECT_EQ(segments.segment(0).candidate(3).value, "2026/09/08");\n\n  Clock::SetClockForUnitTest(nullptr);\n}\n\nTEST_F(DateRewriterTest, NumberRewriterTest) {''')

          # 4) Move date settings out of Dictionary and into a dedicated tab.
          old_date_ui = '''            <item row="1" column="1">\n             <widget class="QCheckBox" name="dateConversionCheckBox">\n              <property name="text">\n               <string>Date/time conversion</string>\n              </property>\n             </widget>\n            </item>\n            <item row="5" column="0">\n   <widget class="QLabel" name="dateConversionFormatLabel">\n    <property name="text">\n     <string>Date output format</string>\n    </property>\n   </widget>\n  </item>\n  <item row="5" column="1">\n   <widget class="QLineEdit" name="dateConversionFormatLineEdit">\n    <property name="toolTip">\n     <string>Preferred date candidate format. Available placeholders: {YEAR}, {MONTH}, {DATE}. Example: {YEAR}-{MONTH}-{DATE}</string>\n    </property>\n    <property name="placeholderText">\n     <string>{YEAR}/{MONTH}/{DATE}</string>\n    </property>\n   </widget>\n  </item>\n'''
          replace_once('src/gui/config_dialog/config_dialog.ui', old_date_ui, '')

          date_tab = '''       <widget class="QWidget" name="dateTab">\n        <attribute name="title">\n         <string>日付</string>\n        </attribute>\n        <layout class="QVBoxLayout" name="dateTabLayout">\n         <property name="leftMargin">\n          <number>18</number>\n         </property>\n         <property name="topMargin">\n          <number>18</number>\n         </property>\n         <property name="rightMargin">\n          <number>18</number>\n         </property>\n         <property name="bottomMargin">\n          <number>18</number>\n         </property>\n         <item>\n          <widget class="QCheckBox" name="dateConversionCheckBox">\n           <property name="text">\n            <string>日付・時刻変換を有効にする</string>\n           </property>\n          </widget>\n         </item>\n         <item>\n          <widget class="QLabel" name="dateConversionFormatLabel">\n           <property name="text">\n            <string>優先する日付フォーマット（上ほど候補の優先度が高くなります）</string>\n           </property>\n          </widget>\n         </item>\n         <item>\n          <widget class="QWidget" name="dateConversionFormatEditorWidget">\n           <layout class="QVBoxLayout" name="dateConversionFormatEditorLayout">\n            <property name="leftMargin">\n             <number>0</number>\n            </property>\n            <property name="topMargin">\n             <number>0</number>\n            </property>\n            <property name="rightMargin">\n             <number>0</number>\n            </property>\n            <property name="bottomMargin">\n             <number>0</number>\n            </property>\n            <item>\n             <widget class="QListWidget" name="dateConversionFormatListWidget">\n              <property name="minimumSize">\n               <size>\n                <width>0</width>\n                <height>110</height>\n               </size>\n              </property>\n              <property name="toolTip">\n               <string>ドラッグして並べ替えできます。上の形式ほど変換候補で優先されます。</string>\n              </property>\n             </widget>\n            </item>\n            <item>\n             <layout class="QHBoxLayout" name="dateConversionFormatInputLayout">\n              <item>\n               <widget class="QLineEdit" name="dateConversionFormatLineEdit">\n                <property name="toolTip">\n                 <string>使用可能: {YEAR}, {MONTH}, {DATE}. 例: {YEAR}-{MONTH}-{DATE}</string>\n                </property>\n                <property name="placeholderText">\n                 <string>{YEAR}/{MONTH}/{DATE}</string>\n                </property>\n               </widget>\n              </item>\n              <item>\n               <widget class="QPushButton" name="dateConversionFormatAddButton">\n                <property name="text">\n                 <string>追加</string>\n                </property>\n               </widget>\n              </item>\n              <item>\n               <widget class="QPushButton" name="dateConversionFormatEditButton">\n                <property name="text">\n                 <string>編集</string>\n                </property>\n               </widget>\n              </item>\n              <item>\n               <widget class="QPushButton" name="dateConversionFormatDeleteButton">\n                <property name="text">\n                 <string>削除</string>\n                </property>\n               </widget>\n              </item>\n             </layout>\n            </item>\n            <item>\n             <layout class="QHBoxLayout" name="dateConversionFormatOrderLayout">\n              <item>\n               <widget class="QPushButton" name="dateConversionFormatUpButton">\n                <property name="text">\n                 <string>↑ 上へ</string>\n                </property>\n               </widget>\n              </item>\n              <item>\n               <widget class="QPushButton" name="dateConversionFormatDownButton">\n                <property name="text">\n                 <string>↓ 下へ</string>\n                </property>\n               </widget>\n              </item>\n              <item>\n               <spacer name="dateConversionFormatOrderSpacer">\n                <property name="orientation">\n                 <enum>Qt::Orientation::Horizontal</enum>\n                </property>\n                <property name="sizeHint" stdset="0">\n                 <size>\n                  <width>40</width>\n                  <height>20</height>\n                 </size>\n                </property>\n               </spacer>\n              </item>\n             </layout>\n            </item>\n            <item>\n             <widget class="QLabel" name="dateConversionFormatPreviewLabel">\n              <property name="text">\n               <string>プレビュー: 2026/09/08</string>\n              </property>\n             </widget>\n            </item>\n            <item>\n             <widget class="QLabel" name="dateConversionFormatExamplesLabel">\n              <property name="text">\n               <string>例: {YEAR}/{MONTH}/{DATE}  ・  {YEAR}.{MONTH}.{DATE}  ・  {YEAR}年{MONTH}月{DATE}日</string>\n              </property>\n              <property name="wordWrap">\n               <bool>true</bool>\n              </property>\n             </widget>\n            </item>\n            <item>\n             <widget class="QLabel" name="dateConversionFormatNoteLabel">\n              <property name="text">\n               <string>ここで追加した形式は標準の日付候補より前に表示されます。</string>\n              </property>\n             </widget>\n            </item>\n           </layout>\n          </widget>\n         </item>\n         <item>\n          <spacer name="dateTabBottomSpacer">\n           <property name="orientation">\n            <enum>Qt::Orientation::Vertical</enum>\n           </property>\n           <property name="sizeHint" stdset="0">\n            <size>\n             <width>20</width>\n             <height>40</height>\n            </size>\n           </property>\n          </spacer>\n         </item>\n        </layout>\n       </widget>\n'''
          replace_once(
              'src/gui/config_dialog/config_dialog.ui',
              '       <widget class="QWidget" name="inputsupport_tab">',
              date_tab + '       <widget class="QWidget" name="inputsupport_tab">')

          # 5) Wire the list editor and migrate the legacy single format.
          replace_once(
              'src/gui/config_dialog/config_dialog.cc',
              '#include <QLineEdit>\n#include <QMessageBox>',
              '#include <QLineEdit>\n#include <QListWidget>\n#include <QListWidgetItem>\n#include <QMessageBox>')

          replace_once(
              'src/gui/config_dialog/config_dialog.cc',
              '''  dateConversionFormatLineEdit->setMaxLength(128);\n  QObject::connect(dateConversionCheckBox, &QCheckBox::toggled,\n                   dateConversionFormatLabel, &QWidget::setEnabled);\n  QObject::connect(dateConversionCheckBox, &QCheckBox::toggled,\n                   dateConversionFormatLineEdit, &QWidget::setEnabled);''',
              '''  dateConversionFormatLineEdit->setMaxLength(128);\n  dateConversionFormatListWidget->setSelectionMode(\n      QAbstractItemView::SingleSelection);\n  dateConversionFormatListWidget->setDragDropMode(\n      QAbstractItemView::InternalMove);\n  dateConversionFormatListWidget->setDefaultDropAction(Qt::MoveAction);\n  dateConversionFormatListWidget->setEditTriggers(\n      QAbstractItemView::DoubleClicked | QAbstractItemView::EditKeyPressed);\n\n  const auto update_date_format_preview = [this]() {\n    QString format;\n    if (QListWidgetItem *item =\n            dateConversionFormatListWidget->currentItem()) {\n      format = item->text().trimmed();\n    } else {\n      format = dateConversionFormatLineEdit->text().trimmed();\n    }\n    if (format.isEmpty()) {\n      format = QStringLiteral("{YEAR}/{MONTH}/{DATE}");\n    }\n    QString preview = format;\n    preview.replace(QStringLiteral("{YEAR}"), QStringLiteral("2026"));\n    preview.replace(QStringLiteral("{MONTH}"), QStringLiteral("09"));\n    preview.replace(QStringLiteral("{DATE}"), QStringLiteral("08"));\n    preview.replace(QStringLiteral("{HOUR}"), QStringLiteral("16"));\n    preview.replace(QStringLiteral("{MINUTE}"), QStringLiteral("02"));\n    dateConversionFormatPreviewLabel->setText(\n        QString::fromUtf8("プレビュー: %1").arg(preview));\n  };\n\n  QObject::connect(dateConversionCheckBox, &QCheckBox::toggled,\n                   dateConversionFormatEditorWidget, &QWidget::setEnabled);\n  QObject::connect(\n      dateConversionFormatAddButton, &QPushButton::clicked, this,\n      [this, update_date_format_preview]() {\n        const QString format =\n            dateConversionFormatLineEdit->text().trimmed();\n        if (format.isEmpty()) {\n          return;\n        }\n        if (!dateConversionFormatListWidget\n                 ->findItems(format, Qt::MatchExactly)\n                 .isEmpty()) {\n          return;\n        }\n        auto *item = new QListWidgetItem(format, dateConversionFormatListWidget);\n        item->setFlags(item->flags() | Qt::ItemIsEditable);\n        dateConversionFormatListWidget->setCurrentItem(item);\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatEditButton, &QPushButton::clicked, this,\n      [this, update_date_format_preview]() {\n        QListWidgetItem *item = dateConversionFormatListWidget->currentItem();\n        if (item == nullptr) {\n          return;\n        }\n        const QString format =\n            dateConversionFormatLineEdit->text().trimmed();\n        if (!format.isEmpty()) {\n          item->setText(format);\n        } else {\n          dateConversionFormatListWidget->editItem(item);\n        }\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatDeleteButton, &QPushButton::clicked, this,\n      [this, update_date_format_preview]() {\n        const int row = dateConversionFormatListWidget->currentRow();\n        if (row < 0) {\n          return;\n        }\n        delete dateConversionFormatListWidget->takeItem(row);\n        if (dateConversionFormatListWidget->count() > 0) {\n          dateConversionFormatListWidget->setCurrentRow(\n              std::min(row, dateConversionFormatListWidget->count() - 1));\n        } else {\n          dateConversionFormatLineEdit->clear();\n        }\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatUpButton, &QPushButton::clicked, this,\n      [this, update_date_format_preview]() {\n        const int row = dateConversionFormatListWidget->currentRow();\n        if (row <= 0) {\n          return;\n        }\n        QListWidgetItem *item = dateConversionFormatListWidget->takeItem(row);\n        dateConversionFormatListWidget->insertItem(row - 1, item);\n        dateConversionFormatListWidget->setCurrentItem(item);\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatDownButton, &QPushButton::clicked, this,\n      [this, update_date_format_preview]() {\n        const int row = dateConversionFormatListWidget->currentRow();\n        if (row < 0 || row >= dateConversionFormatListWidget->count() - 1) {\n          return;\n        }\n        QListWidgetItem *item = dateConversionFormatListWidget->takeItem(row);\n        dateConversionFormatListWidget->insertItem(row + 1, item);\n        dateConversionFormatListWidget->setCurrentItem(item);\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatListWidget, &QListWidget::currentRowChanged, this,\n      [this, update_date_format_preview](int row) {\n        if (row >= 0) {\n          dateConversionFormatLineEdit->setText(\n              dateConversionFormatListWidget->item(row)->text());\n        }\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatListWidget, &QListWidget::itemChanged, this,\n      [this, update_date_format_preview](QListWidgetItem *item) {\n        if (item == dateConversionFormatListWidget->currentItem()) {\n          dateConversionFormatLineEdit->setText(item->text());\n        }\n        update_date_format_preview();\n      });\n  QObject::connect(\n      dateConversionFormatLineEdit, &QLineEdit::textChanged, this,\n      [this, update_date_format_preview](const QString &) {\n        if (dateConversionFormatListWidget->currentItem() == nullptr) {\n          update_date_format_preview();\n        }\n      });''')

          replace_once(
              'src/gui/config_dialog/config_dialog.cc',
              '''  SET_CHECKBOX(dateConversionCheckBox, use_date_conversion);\n  dateConversionFormatLineEdit->setText(\n      ToQString(config.date_conversion_custom_format()));\n  dateConversionFormatLabel->setEnabled(config.use_date_conversion());\n  dateConversionFormatLineEdit->setEnabled(config.use_date_conversion());''',
              '''  SET_CHECKBOX(dateConversionCheckBox, use_date_conversion);\n  dateConversionFormatListWidget->clear();\n  if (config.date_conversion_custom_formats_size() > 0) {\n    for (const std::string &format :\n         config.date_conversion_custom_formats()) {\n      if (format.empty()) {\n        continue;\n      }\n      auto *item = new QListWidgetItem(\n          ToQString(format), dateConversionFormatListWidget);\n      item->setFlags(item->flags() | Qt::ItemIsEditable);\n    }\n  } else if (!config.date_conversion_custom_format().empty()) {\n    auto *item = new QListWidgetItem(\n        ToQString(config.date_conversion_custom_format()),\n        dateConversionFormatListWidget);\n    item->setFlags(item->flags() | Qt::ItemIsEditable);\n  }\n  if (dateConversionFormatListWidget->count() > 0) {\n    dateConversionFormatListWidget->setCurrentRow(0);\n  } else {\n    dateConversionFormatLineEdit->clear();\n  }\n  dateConversionFormatEditorWidget->setEnabled(config.use_date_conversion());''')

          replace_once(
              'src/gui/config_dialog/config_dialog.cc',
              '''  GET_CHECKBOX(dateConversionCheckBox, use_date_conversion);\n  config->set_date_conversion_custom_format(\n      dateConversionFormatLineEdit->text().trimmed().toUtf8().constData());''',
              '''  GET_CHECKBOX(dateConversionCheckBox, use_date_conversion);\n  config->clear_date_conversion_custom_formats();\n  std::string first_date_conversion_format;\n  for (int i = 0; i < dateConversionFormatListWidget->count(); ++i) {\n    const QString format =\n        dateConversionFormatListWidget->item(i)->text().trimmed();\n    if (format.isEmpty()) {\n      continue;\n    }\n    const QByteArray utf8 = format.toUtf8();\n    const std::string value(utf8.constData(), utf8.size());\n    if (first_date_conversion_format.empty()) {\n      first_date_conversion_format = value;\n    }\n    config->add_date_conversion_custom_formats(value);\n  }\n  if (first_date_conversion_format.empty()) {\n    config->clear_date_conversion_custom_format();\n  } else {\n    config->set_date_conversion_custom_format(first_date_conversion_format);\n  }''')

          # 6) Add update controls to About / version information.
          p = Path('src/gui/about_dialog/about_dialog.ui')
          about_ui = p.read_text(encoding='utf-8')
          if about_ui.count('<height>250</height>') != 3:
              raise SystemExit('about_dialog.ui: expected three 250 heights')
          about_ui = about_ui.replace('<height>250</height>', '<height>320</height>')
          old_frame = '''     <y>120</y>\n     <width>511</width>\n     <height>161</height>'''
          new_frame = '''     <y>190</y>\n     <width>511</width>\n     <height>141</height>'''
          if about_ui.count(old_frame) != 1:
              raise SystemExit('about_dialog.ui: color frame geometry mismatch')
          about_ui = about_ui.replace(old_frame, new_frame, 1)
          update_widget = '''  <widget class="QWidget" name="updateWidget">\n   <property name="geometry">\n    <rect>\n     <x>10</x>\n     <y>120</y>\n     <width>471</width>\n     <height>66</height>\n    </rect>\n   </property>\n   <layout class="QGridLayout" name="updateLayout">\n    <property name="leftMargin">\n     <number>0</number>\n    </property>\n    <property name="topMargin">\n     <number>0</number>\n    </property>\n    <property name="rightMargin">\n     <number>0</number>\n    </property>\n    <property name="bottomMargin">\n     <number>0</number>\n    </property>\n    <item row="0" column="0" colspan="3">\n     <widget class="QLabel" name="updateStatusLabel">\n      <property name="text">\n       <string>GitHub Release の更新を確認できます。</string>\n      </property>\n     </widget>\n    </item>\n    <item row="1" column="0">\n     <widget class="QPushButton" name="checkUpdateButton">\n      <property name="text">\n       <string>更新を確認</string>\n      </property>\n     </widget>\n    </item>\n    <item row="1" column="1">\n     <widget class="QPushButton" name="updateButton">\n      <property name="enabled">\n       <bool>false</bool>\n      </property>\n      <property name="text">\n       <string>更新する</string>\n      </property>\n     </widget>\n    </item>\n    <item row="1" column="2">\n     <widget class="QLabel" name="releaseLinkLabel">\n      <property name="text">\n       <string>&lt;a href=&quot;https://github.com/hglasswater-boop/mozkey-date/releases/latest&quot;&gt;GitHub Release&lt;/a&gt;</string>\n      </property>\n      <property name="openExternalLinks">\n       <bool>true</bool>\n      </property>\n      <property name="alignment">\n       <set>Qt::AlignmentFlag::AlignRight|Qt::AlignmentFlag::AlignTrailing|Qt::AlignmentFlag::AlignVCenter</set>\n      </property>\n     </widget>\n    </item>\n   </layout>\n  </widget>\n'''
          marker = '  <widget class="QWidget" name="gridLayoutWidget">'
          if about_ui.count(marker) != 1:
              raise SystemExit('about_dialog.ui: root grid marker mismatch')
          about_ui = about_ui.replace(marker, update_widget + marker, 1)
          p.write_text(about_ui, encoding='utf-8')

          replace_once(
              'src/gui/about_dialog/about_dialog.cc',
              '#include <QtGui>\n#include <algorithm>',
              '#include <QtGui>\n#include <QProcess>\n#include <algorithm>')
          replace_once(
              'src/gui/about_dialog/about_dialog.cc',
              '''  Replace(replaced, "[ProductUrl]", "https://github.com/koyasi777/mozkey");\n  Replace(replaced, "[ForumUrl]", "https://github.com/koyasi777/mozkey/issues");''',
              '''  Replace(replaced, "[ProductUrl]",\n          "https://github.com/hglasswater-boop/mozkey-date");\n  Replace(replaced, "[ForumUrl]",\n          "https://github.com/hglasswater-boop/mozkey-date/issues");''')

          about_logic = r'''  SetLabelText(label_terms);
  SetLabelText(label_credits);

#ifdef _WIN32
  updateButton->setEnabled(false);

  QObject::connect(checkUpdateButton, &QPushButton::clicked, this, [this]() {
    checkUpdateButton->setEnabled(false);
    updateButton->setEnabled(false);
    updateStatusLabel->setToolTip(QString());
    updateStatusLabel->setText(QString::fromUtf8("更新を確認しています..."));

    auto *process = new QProcess(this);
    const QString command = QStringLiteral(
        "$ErrorActionPreference='Stop';"
        "$ProgressPreference='SilentlyContinue';"
        "$headers=@{'User-Agent'='mozkey-date-about';"
        "'Accept'='application/vnd.github+json'};"
        "$release=Invoke-RestMethod -Headers $headers -Uri "
        "'https://api.github.com/repos/hglasswater-boop/mozkey-date/releases/latest';"
        "$state=Join-Path $env:LOCALAPPDATA "
        "'MozkeyDate\\last-installed-release.txt';"
        "$installed='';"
        "if(Test-Path -LiteralPath $state){"
        "$installed=(Get-Content -LiteralPath $state -Raw).Trim()};"
        "[Console]::Out.Write(([string]$release.tag_name) + \"`n\" + "
        "$installed);");

    QObject::connect(
        process,
        static_cast<void (QProcess::*)(int, QProcess::ExitStatus)>(
            &QProcess::finished),
        this,
        [this, process](int exit_code, QProcess::ExitStatus exit_status) {
          checkUpdateButton->setEnabled(true);
          const QString stderr_text =
              QString::fromUtf8(process->readAllStandardError()).trimmed();
          if (exit_status != QProcess::NormalExit || exit_code != 0) {
            updateStatusLabel->setText(
                QString::fromUtf8("更新確認に失敗しました。"));
            updateStatusLabel->setToolTip(stderr_text);
            process->deleteLater();
            return;
          }

          const QString output =
              QString::fromUtf8(process->readAllStandardOutput()).trimmed();
          const QStringList lines =
              output.split(QLatin1Char('\n'), Qt::KeepEmptyParts);
          const QString latest = lines.value(0).trimmed();
          const QString installed = lines.value(1).trimmed();
          if (latest.isEmpty()) {
            updateStatusLabel->setText(
                QString::fromUtf8("最新バージョンを取得できませんでした。"));
            process->deleteLater();
            return;
          }

          if (!installed.isEmpty() && installed == latest) {
            updateStatusLabel->setText(
                QString::fromUtf8("最新版です（%1）").arg(latest));
            updateButton->setEnabled(false);
          } else if (!installed.isEmpty()) {
            updateStatusLabel->setText(
                QString::fromUtf8("更新があります: %1 → %2")
                    .arg(installed, latest));
            updateButton->setEnabled(true);
          } else {
            updateStatusLabel->setText(
                QString::fromUtf8("最新リリース: %1").arg(latest));
            updateButton->setEnabled(true);
          }
          process->deleteLater();
        });

    process->start(
        QStringLiteral("powershell.exe"),
        QStringList{QStringLiteral("-NoProfile"),
                    QStringLiteral("-NonInteractive"),
                    QStringLiteral("-ExecutionPolicy"),
                    QStringLiteral("Bypass"), QStringLiteral("-Command"),
                    command});
  });

  QObject::connect(updateButton, &QPushButton::clicked, this, [this]() {
    checkUpdateButton->setEnabled(false);
    updateButton->setEnabled(false);
    updateStatusLabel->setToolTip(QString());
    updateStatusLabel->setText(
        QString::fromUtf8("更新ツールを準備しています..."));

    auto *process = new QProcess(this);
    const QString command = QStringLiteral(
        "$ErrorActionPreference='Stop';"
        "$ProgressPreference='SilentlyContinue';"
        "$headers=@{'User-Agent'='mozkey-date-about';"
        "'Accept'='application/vnd.github+json'};"
        "$release=Invoke-RestMethod -Headers $headers -Uri "
        "'https://api.github.com/repos/hglasswater-boop/mozkey-date/releases/latest';"
        "$asset=$release.assets | Where-Object {"
        "$_.name -eq 'update-mozkey-date.ps1'} | Select-Object -First 1;"
        "if($null -eq $asset){throw 'update-mozkey-date.ps1 is missing'};"
        "$path=Join-Path $env:TEMP ('mozkey-date-updater-' + "
        "[Guid]::NewGuid().ToString('N') + '.ps1');"
        "Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url "
        "-OutFile $path;"
        "$quoted='\"' + $path + '\"';"
        "Start-Process -FilePath 'powershell.exe' -ArgumentList "
        "@('-NoProfile','-ExecutionPolicy','Bypass','-File',$quoted);");

    QObject::connect(
        process,
        static_cast<void (QProcess::*)(int, QProcess::ExitStatus)>(
            &QProcess::finished),
        this,
        [this, process](int exit_code, QProcess::ExitStatus exit_status) {
          checkUpdateButton->setEnabled(true);
          const QString stderr_text =
              QString::fromUtf8(process->readAllStandardError()).trimmed();
          if (exit_status == QProcess::NormalExit && exit_code == 0) {
            updateStatusLabel->setText(QString::fromUtf8(
                "更新ツールを起動しました。画面の案内に従ってください。"));
          } else {
            updateStatusLabel->setText(
                QString::fromUtf8("更新ツールを起動できませんでした。"));
            updateStatusLabel->setToolTip(stderr_text);
            updateButton->setEnabled(true);
          }
          process->deleteLater();
        });

    process->start(
        QStringLiteral("powershell.exe"),
        QStringList{QStringLiteral("-NoProfile"),
                    QStringLiteral("-NonInteractive"),
                    QStringLiteral("-ExecutionPolicy"),
                    QStringLiteral("Bypass"), QStringLiteral("-Command"),
                    command});
  });
