name: English input assistance check
# Revalidate the aggregate rewriter after wiring the English input dependency.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/english-word-dictionary

permissions:
  contents: read

concurrency:
  group: english-word-dictionary-feature-check
  cancel-in-progress: true

jobs:
  windows_check:
    name: English input assistance on Windows
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update-deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      - name: Test English word dictionary
        shell: pwsh
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          $ErrorActionPreference = "Continue"
          & bazelisk test --config oss_windows --config release_build --test_output=errors --verbose_failures //rewriter:english_word_dictionary_rewriter_test 2>&1 | Tee-Object -FilePath english-word-dictionary-bazel.log
          $exitCode = $LASTEXITCODE
          Write-Host "bazel exit code: $exitCode"
          exit $exitCode

      - name: Upload English test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: english-word-dictionary-bazel-log
          path: src/english-word-dictionary-bazel.log
          if-no-files-found: warn

      - name: Test English variants
        if: always()
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: >-
          bazelisk test --config oss_windows --config release_build
          --test_output=errors --verbose_failures
          //rewriter:english_variants_rewriter_test

      - name: Test rewriter integration
        if: always()
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: >-
          bazelisk test --config oss_windows --config release_build
          --test_output=errors --verbose_failures
          //rewriter:rewriter_test

      - name: Build Qt
        if: always()
        shell: cmd
        working-directory: .\src
        run: python build_tools/build_qt.py --release --confirm_license

      - name: Build Properties dialog
        if: always()
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: >-
          bazelisk build --config oss_windows --config release_build
          --verbose_failures
          //gui/config_dialog:config_dialog
