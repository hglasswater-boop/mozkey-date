name: English word dictionary feature check

on:
  push:
    branches:
      - feature/english-word-dictionary

permissions:
  contents: read

concurrency:
  group: english-word-dictionary-feature-check
  cancel-in-progress: true

jobs:
  rewriter_tests:
    name: Rewriter tests on Windows
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Restore update_deps cache
        uses: actions/cache@v5
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: python build_tools/update_deps.py

      - name: Run rewriter tests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: >-
          bazelisk test --config oss_windows --config release_build
          --test_output=errors
          //rewriter:english_variants_rewriter_test
          //rewriter:rewriter_test
