name: Tag Windows release

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: mozkey-date-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/release ')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Parse and verify release request
        id: release
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          body="$(printf '%s' "$COMMENT_BODY" | tr -d '\r')"
          if [[ ! "$body" =~ ^/release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$ ]]; then
            echo "Release command must be exactly: /release vX.Y.Z" >&2
            exit 1
          fi
          tag="${BASH_REMATCH[1]}"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"
          [[ -n "$merged_at" && -n "$merge_sha" ]] || {
            echo "Release commands are accepted only on merged pull requests." >&2
            exit 1
          }

          current_sha="$(git rev-parse HEAD)"
          [[ "$merge_sha" == "$current_sha" ]] || {
            echo "The release command must be posted on the pull request merged at current main HEAD." >&2
            echo "PR merge SHA: $merge_sha" >&2
            echo "main HEAD:    $current_sha" >&2
            exit 1
          }

          major="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MAJOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          minor="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MINOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          patch="$(sed -n 's/^MOZKEY_RELEASE_VERSION_PATCH = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          source_tag="v${major}.${minor}.${patch}"
          [[ "$tag" == "$source_tag" ]] || {
            echo "Release command/version mismatch: command=$tag source=$source_tag" >&2
            exit 1
          }

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            resolved="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
            [[ "$resolved" == "$current_sha" ]] || {
              echo "Existing tag points elsewhere: tag=$tag expected=$current_sha actual=${resolved:-unknown}" >&2
              exit 1
            }
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists: $tag" >&2
              exit 1
            fi
            tag_exists=true
            echo "Reusing existing unpublished tag $tag at $current_sha"
          fi

          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            requested_version="${tag#v}"
            highest="$(printf '%s\n%s\n' "$latest_version" "$requested_version" | sort -V | tail -n 1)"
            [[ "$highest" == "$requested_version" && "$latest_version" != "$requested_version" ]] || {
              echo "Release version must be newer than latest release: latest=$latest_tag requested=$tag" >&2
              exit 1
            }

            if git diff --quiet "$latest_tag"...HEAD -- . \
              ':(exclude)src/version.bzl' \
              ':(exclude).github/**' \
              ':(exclude)README.md' \
              ':(exclude)docs/**'; then
              echo "Refusing a version-only/metadata-only release." >&2
              exit 1
            fi
          fi

          grep -q 'Version::GetMozkeyReleaseVersion()' src/gui/about_dialog/about_dialog.cc || {
            echo "About dialog is not using the mozkey-date release version." >&2
            exit 1
          }
          grep -q 'Invoke-WebRequest -UseBasicParsing' src/gui/about_dialog/about_dialog.cc || {
            echo "About updater is missing Windows PowerShell 5.1-safe downloading." >&2
            exit 1
          }
          grep -q 'dateConversionFormatListWidget' src/gui/config_dialog/config_dialog.cc || {
            echo "Date conversion settings UI is missing." >&2
            exit 1
          }
          grep -q 'if ($Force -and $installedTag -eq $tag)' tools/windows/update-mozkey-date.ps1 || {
            echo "Updater major-upgrade repair guard is missing." >&2
            exit 1
          }
          test -f tools/windows/test-msi-major-upgrade.ps1 || {
            echo "MSI major-upgrade verification script is missing." >&2
            exit 1
          }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "Release request verified: $tag -> $current_sha"

      - name: Create annotated release tag
        if: steps.release.outputs.tag_exists != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Mozkey Date $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Record Windows release-build baseline
        id: windows_baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          baseline="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows.yaml/runs?event=workflow_dispatch&per_page=100" |
            jq -r --arg sha "$RELEASE_SHA" --arg branch "$RELEASE_TAG" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch) | .id] | max // 0')"
          echo "run_id=$baseline" >> "$GITHUB_OUTPUT"
          echo "Existing tagged Windows workflow baseline: $baseline"

      - name: Dispatch tagged Windows release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run windows.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f mode=release

      - name: Wait for successful Windows release build
        id: windows_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          BASELINE_RUN_ID: ${{ steps.windows_baseline.outputs.run_id }}
        run: |
          set -euo pipefail

          run_id=""
          for _ in $(seq 1 180); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows.yaml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg sha "$RELEASE_SHA" --arg branch "$RELEASE_TAG" --argjson baseline "$BASELINE_RUN_ID" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .id > $baseline) | .id] | max // empty')"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || {
            echo "Could not locate the dispatched Windows release build." >&2
            exit 1
          }
          echo "Windows release build run: $run_id"

          for _ in $(seq 1 540); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || {
                echo "Windows release build failed: run=$run_id conclusion=$conclusion" >&2
                exit 1
              }
              break
            fi
            sleep 5
          done

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r '.status' <<<"$run_json")" == "completed" && "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]] || {
            echo "Windows release build did not complete successfully within the workflow timeout." >&2
            exit 1
          }

          artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" | jq '[.artifacts[] | select(.name == "Mozc64_universal.msi" and (.expired | not))] | length')"
          [[ "$artifact_count" == "1" ]] || {
            echo "Expected exactly one universal MSI artifact from run $run_id, found $artifact_count" >&2
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Windows release build succeeded with one universal MSI artifact."

      - name: Record publisher baseline
        id: publisher_baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-windows.yml/runs?event=workflow_dispatch&per_page=100" | jq -r '[.workflow_runs[].id] | max // 0')"
          echo "run_id=$baseline" >> "$GITHUB_OUTPUT"

      - name: Dispatch verified Windows publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_ID: ${{ steps.windows_run.outputs.run_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run release-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f run_id="$WINDOWS_RUN_ID" \
            -f release_tag="$RELEASE_TAG" \
            -f release_sha="$RELEASE_SHA"

      - name: Wait for publisher and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          BASELINE_RUN_ID: ${{ steps.publisher_baseline.outputs.run_id }}
        run: |
          set -euo pipefail

          publish_run_id=""
          for _ in $(seq 1 180); do
            publish_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-windows.yml/runs?event=workflow_dispatch&per_page=100" |
              jq -r --arg sha "$RELEASE_SHA" --argjson baseline "$BASELINE_RUN_ID" '[.workflow_runs[] | select(.head_sha == $sha and .id > $baseline) | .id] | max // empty')"
            [[ -n "$publish_run_id" ]] && break
            sleep 5
          done
          [[ -n "$publish_run_id" ]] || {
            echo "Could not locate the dispatched Windows publisher." >&2
            exit 1
          }
          echo "Windows publisher run: $publish_run_id"

          for _ in $(seq 1 360); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$publish_run_id")"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || {
                echo "Windows publisher failed: run=$publish_run_id conclusion=$conclusion" >&2
                exit 1
              }
              break
            fi
            sleep 5
          done

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$publish_run_id")"
          [[ "$(jq -r '.status' <<<"$run_json")" == "completed" && "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]] || {
            echo "Windows publisher did not complete successfully within the workflow timeout." >&2
            exit 1
          }

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" && "$(jq -r '.prerelease' <<<"$release_json")" == "false" ]] || {
            echo "Release is still draft/prerelease: $RELEASE_TAG" >&2
            exit 1
          }

          missing="$(jq -r '["MozkeyDate-Windows.msi","MozkeyDate-Windows.msi.sha256","update-mozkey-date.ps1","update-mozkey-date.cmd"] - [.assets[].name] | .[]' <<<"$release_json")"
          [[ -z "$missing" ]] || {
            echo "Release assets missing:" >&2
            printf '%s\n' "$missing" >&2
            exit 1
          }

          echo "Release completed: $RELEASE_TAG"
