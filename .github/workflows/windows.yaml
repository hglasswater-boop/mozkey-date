name: CI for Windows
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md

# Keep day-to-day CI focused on the Windows x64 package. v* tags still build
# the universal installer required by release-windows.yml. The previous full
# Windows matrix is preserved outside .github/workflows as a reference while
# we measure and selectively bring expensive audits back as manual jobs.
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Windows build profile
        required: true
        default: x64
        type: choice
        options:
          - x64
          - release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout x64 build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'x64') }}
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout universal release build
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Detect MSI upgrade-sensitive changes
        if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $sensitive = @(
            "src/version.bzl",
            "src/build_tools/gen_win32_resource_header.py",
            "src/build_tools/mozc_win32_resource_template.rc",
            "src/win32/installer/",
            "tools/windows/test-msi-major-upgrade.ps1",
            ".github/workflows/windows.yaml",
            ".github/workflows/release-windows.yml"
          )

          $before = $env:BEFORE_SHA
          $after = $env:AFTER_SHA
          if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
            $changed = @(git show --pretty=format: --name-only $after)
          } else {
            git cat-file -e "$before^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags --depth=1 origin $before
            }
            $changed = @(git diff --name-only $before $after)
          }

          $required = $false
          foreach ($path in $changed) {
            if ([string]::IsNullOrWhiteSpace($path)) {
              continue
            }
            foreach ($prefix in $sensitive) {
              if ($path -eq $prefix -or $path.StartsWith($prefix, [System.StringComparison]::Ordinal)) {
                $required = $true
                Write-Host "MSI upgrade verification required by change: $path"
                break
              }
            }
            if ($required) {
              break
            }
          }

          "RUN_MSI_UPGRADE_TEST=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Test Windows PowerShell 5.1 updater compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\tools\windows\update-mozkey-date.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $details = ($parseErrors | ForEach-Object { $_.Message }) -join "; "
            throw "Updater is not valid Windows PowerShell 5.1 syntax: $details"
          }

          $updater = Get-Content -LiteralPath ".\tools\windows\update-mozkey-date.ps1" -Raw
          if ($updater -notmatch 'Invoke-WebRequest\s+-UseBasicParsing') {
            throw "Updater downloads must use Invoke-WebRequest -UseBasicParsing."
          }
          if ($updater -match 'Set-Content[^\r\n]*-Encoding\s+utf8NoBOM') {
            throw "utf8NoBOM is not supported by Set-Content in Windows PowerShell 5.1."
          }

          $about = Get-Content -LiteralPath ".\src\gui\about_dialog\about_dialog.cc" -Raw
          if ($about -notmatch 'Invoke-WebRequest -UseBasicParsing') {
            throw "About updater bootstrap must use Invoke-WebRequest -UseBasicParsing."
          }

          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion) updater compatibility checks passed."

      # Keep the merge-ut working clone separate from generated daily files.
      # This avoids duplicating a potentially large git worktree in every
      # date-keyed dictionary cache while still making a new-day refresh cheap.
      - name: Restore dictionary source cache
        id: dictionary-source-cache
        uses: actions/cache/restore@v5
        with:
          path: dist/dictionary
          key: dictionary-sources-${{ runner.os }}-v1-${{ hashFiles('tools/dictionary/import_merge_ut.ps1') }}

      - name: Set daily dictionary cache date
        shell: pwsh
        run: |
          $tokyo = [System.TimeZoneInfo]::FindSystemTimeZoneById("Tokyo Standard Time")
          $today = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            $tokyo
          ).ToString("yyyy-MM-dd")
          "DICTIONARY_CACHE_DATE=$today" >> $env:GITHUB_ENV

      - name: Restore daily dictionary cache
        id: dictionary-cache
        uses: actions/cache/restore@v5
        with:
          path: src/data/dictionary_koyasi/generated
          key: daily-dictionary-${{ runner.os }}-${{ env.DICTIONARY_CACHE_DATE }}-v2-${{ hashFiles('tools/dictionary/**', 'src/data/dictionary_oss/**', 'src/data/dictionary_koyasi/BUILD.bazel', 'src/data/dictionary_koyasi/sample/**') }}

      - name: Prepare daily dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\prepare_daily_dictionary.ps1

      # use_merge_ut_profile.ps1 also updates dictionary_oss/BUILD.bazel, which
      # is intentionally not part of the cache payload.
      - name: Activate daily dictionary profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\dictionary\use_merge_ut_profile.ps1 -Profile daily

      - name: Save dictionary source cache
        if: steps.dictionary-source-cache.outputs.cache-hit != 'true' && steps.dictionary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: dist/dictionary
          key: ${{ steps.dictionary-source-cache.outputs.cache-primary-key }}

      - name: Save daily dictionary cache
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: src/data/dictionary_koyasi/generated
          key: ${{ steps.dictionary-cache.outputs.cache-primary-key }}

      # Reuse the established key from the old Windows workflow so existing
      # download caches remain useful.
      - name: Restore dependency download cache
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: src/third_party_cache
          key: update-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/update_deps.py

      - name: Save dependency download cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: src/third_party_cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # Qt is one of the most expensive fixed prerequisites. Cache the built
      # output, not qt_src. Save it immediately after a successful build so a
      # later test/package failure does not throw away 20+ minutes of work.
      - name: Restore built Qt cache
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            src/third_party/qt
            src/third_party/qt_host
          key: qt-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      - name: Save built Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            src/third_party/qt
            src/third_party/qt_host
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Delete Qt source tree to save disk space
        shell: pwsh
        run: |
          if (Test-Path .\src\third_party\qt_src) {
            Remove-Item .\src\third_party\qt_src -Recurse -Force
          }

      # Keep one bounded Bazel snapshot per day. GitHub Actions caches are
      # immutable, so a date component lets the snapshot advance without
      # creating a full archive for every commit. Seed a new day from the most
      # recent v2 snapshot, or from the previous per-commit v1 cache while the
      # new scheme is being rolled out.
      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v5
        with:
          path: src/.bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ runner.arch }}-v2-${{ env.DICTIONARY_CACHE_DATE }}-${{ hashFiles('src/MODULE.bazel', 'src/.bazelrc', 'src/build_defs.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-v2-
            bazel-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('src/MODULE.bazel', 'src/.bazelrc', 'src/build_defs.bzl') }}-

      - name: Prepare CRT redist directory expected by WiX
        shell: pwsh
        run: |
          $expectedDir = "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Redist\MSVC\14.50.35710\x64\Microsoft.VC145.CRT"

          $requiredDlls = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          $searchRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022",
            "C:\Program Files\Microsoft Visual Studio\17",
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022",
            "C:\Program Files (x86)\Microsoft Visual Studio\17",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          ) | Where-Object { Test-Path $_ }

          # Limit discovery to the known VS/VC/Redist/MSVC hierarchy instead of
          # recursively walking the complete Visual Studio installation.
          $candidates = foreach ($vsRoot in $searchRoots) {
            foreach ($edition in Get-ChildItem -Path $vsRoot -Directory -ErrorAction SilentlyContinue) {
              $msvcRoot = Join-Path $edition.FullName "VC\Redist\MSVC"
              if (-not (Test-Path $msvcRoot)) {
                continue
              }

              foreach ($versionDir in Get-ChildItem -Path $msvcRoot -Directory -ErrorAction SilentlyContinue) {
                $x64Root = Join-Path $versionDir.FullName "x64"
                if (-not (Test-Path $x64Root)) {
                  continue
                }

                Get-ChildItem -Path $x64Root -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue
              }
            }
          }

          $sourceDir = $candidates |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $sourceDir) {
            throw "No x64 Visual C++ CRT redistribution directory was found."
          }

          # If the runner already has exactly the path WiX expects, only verify
          # it. Otherwise create the compatibility directory and copy the CRT.
          $sameDir = [System.StringComparer]::OrdinalIgnoreCase.Equals(
            $sourceDir.FullName.TrimEnd("\"),
            $expectedDir.TrimEnd("\")
          )
          if (-not $sameDir) {
            New-Item -ItemType Directory -Force $expectedDir | Out-Null
          }

          foreach ($dll in $requiredDlls) {
            $source = Join-Path $sourceDir.FullName $dll
            if (-not (Test-Path $source -PathType Leaf)) {
              throw "Required CRT DLL was not found: $source"
            }
            if (-not $sameDir) {
              Copy-Item $source (Join-Path $expectedDir $dll) -Force
            }
          }

      # Keep the disk cache itself bounded because GitHub Actions cache storage
      # is shared with Qt and dependency caches. Zero idle delay lets Bazel run
      # cache GC between the test and package invocations on ephemeral runners.
      - name: Test date rewriter
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test --config release_build --disk_cache=.bazel-disk-cache --experimental_disk_cache_gc_max_size=4G --experimental_disk_cache_gc_idle_delay=0s //rewriter:date_rewriter_test

      - name: Test English word dictionary
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test --config release_build --disk_cache=.bazel-disk-cache --experimental_disk_cache_gc_max_size=4G --experimental_disk_cache_gc_idle_delay=0s //rewriter:english_word_dictionary_rewriter_test

      - name: Build x64 package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'x64') }}
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --disk_cache=.bazel-disk-cache --experimental_disk_cache_gc_max_size=4G --experimental_disk_cache_gc_idle_delay=0s package

      - name: Save x64 Bazel disk cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'x64') && steps.bazel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: src/.bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Verify upgrade from previous stable MSI
        if: ${{ env.RUN_MSI_UPGRADE_TEST == 'true' && !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'x64') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "mozkey-date-windows-ci"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $versionSource = Get-Content -LiteralPath ".\src\version.bzl" -Raw
          $majorMatch = [regex]::Match($versionSource, '(?m)^MOZKEY_RELEASE_VERSION_MAJOR = ([0-9]+)$')
          $minorMatch = [regex]::Match($versionSource, '(?m)^MOZKEY_RELEASE_VERSION_MINOR = ([0-9]+)$')
          $patchMatch = [regex]::Match($versionSource, '(?m)^MOZKEY_RELEASE_VERSION_PATCH = ([0-9]+)$')
          if (-not $majorMatch.Success -or -not $minorMatch.Success -or -not $patchMatch.Success) {
            throw "Could not derive mozkey-date release version from src/version.bzl."
          }
          $candidateReleaseVersion = [version]::new(
            [int]$majorMatch.Groups[1].Value,
            [int]$minorMatch.Groups[1].Value,
            [int]$patchMatch.Groups[1].Value
          )

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=50" -Headers $headers
          $baselines = foreach ($release in $releases) {
            if ($release.draft -or $release.prerelease) {
              continue
            }

            $tagMatch = [regex]::Match([string]$release.tag_name, '^v([0-9]+)\.([0-9]+)\.([0-9]+)$')
            if (-not $tagMatch.Success) {
              continue
            }

            $releaseVersion = [version]::new(
              [int]$tagMatch.Groups[1].Value,
              [int]$tagMatch.Groups[2].Value,
              [int]$tagMatch.Groups[3].Value
            )
            if ($releaseVersion -ge $candidateReleaseVersion) {
              continue
            }

            $asset = $release.assets |
              Where-Object { $_.name -eq "MozkeyDate-Windows.msi" } |
              Select-Object -First 1
            if (-not $asset) {
              continue
            }

            [pscustomobject]@{
              Release = $release
              Version = $releaseVersion
              Asset = $asset
            }
          }

          $baseline = $baselines |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $baseline) {
            throw "No stable Mozkey Date release older than v$candidateReleaseVersion with MozkeyDate-Windows.msi is available for the upgrade test."
          }

          New-Item -ItemType Directory -Path ".\previous-release" -Force | Out-Null
          $downloadHeaders = $headers.Clone()
          $downloadHeaders["Accept"] = "application/octet-stream"
          Invoke-WebRequest -UseBasicParsing -Uri $baseline.Asset.url -Headers $downloadHeaders -OutFile ".\previous-release\MozkeyDate-Windows.msi"

          Write-Host "Testing major upgrade from $($baseline.Release.tag_name) to v$candidateReleaseVersion."
          .\tools\windows\test-msi-major-upgrade.ps1 `
            -PreviousMsi ".\previous-release\MozkeyDate-Windows.msi" `
            -CandidateMsi ".\src\bazel-bin\win32\installer\Mozc64.msi" `
            -LogDirectory ".\upgrade-logs"

      - name: Upload MSI upgrade logs on failure
        if: ${{ failure() && env.RUN_MSI_UPGRADE_TEST == 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: msi-upgrade-logs-${{ github.run_id }}
          path: upgrade-logs
          if-no-files-found: ignore

      - name: Upload x64 MSI
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'x64') }}
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_x64.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: error

      - name: Build universal release package
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build --config release_build --config win_universal_installer --disk_cache=.bazel-disk-cache --experimental_disk_cache_gc_max_size=4G --experimental_disk_cache_gc_idle_delay=0s package

      - name: Save universal Bazel disk cache
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) && steps.bazel-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: src/.bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Upload universal MSI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/upload-artifact@v6
        with:
          name: Mozc64_universal.msi
          path: src/bazel-bin/win32/installer/Mozc64.msi
          if-no-files-found: error
