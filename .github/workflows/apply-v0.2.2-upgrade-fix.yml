name: Apply v0.2.2 upgrade fix

on:
  push:
    paths:
      - .github/workflows/apply-v0.2.2-upgrade-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/apply-v0.2.2-upgrade-fix
          persist-credentials: true
      - name: Apply verified source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          version = Path('src/version.bzl')
          text = version.read_text(encoding='utf-8')
          old = 'MOZKEY_RELEASE_VERSION_PATCH = 1'
          new = 'MOZKEY_RELEASE_VERSION_PATCH = 2'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          version.write_text(text.replace(old, new), encoding='utf-8')

          wxs = Path('src/win32/installer/installer_oss_64bit.wxs')
          text = wxs.read_text(encoding='utf-8')
          old = '''      <!--
        RemoveExistingProducts needs to be scheduled between InstallExecute and
        InstallFinalize to correctly deal with errors which occur when the old
        product is removed on upgrade.
        http://msdn.microsoft.com/en-us/library/aa371197(VS.85).aspx
      -->
      <InstallExecute Before="RemoveExistingProducts" />
      <RemoveExistingProducts Before="StopCacheServiceForRollback" />'''
          new = '''      <!--
        Remove the previous Mozkey/mozkey-date product completely before the
        new execution script is generated.  mozkey-date release versions can
        change while the upstream Mozc PE file versions stay the same, so a
        late major-upgrade removal can cause Windows Installer file-versioning
        rules to retain binaries from the previous release.  Scheduling after
        InstallValidate follows the supported Windows Installer sequence and
        guarantees that the new package lays down a clean set of binaries.
      -->
      <RemoveExistingProducts After="InstallValidate" />'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old RemoveExistingProducts block, found {text.count(old)}')
          wxs.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          git diff -- src/version.bzl src/win32/installer/installer_oss_64bit.wxs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.bzl src/win32/installer/installer_oss_64bit.wxs
          git commit -m "Fix stale binaries during Windows major upgrade"
          git push origin HEAD:ops/apply-v0.2.2-upgrade-fix
