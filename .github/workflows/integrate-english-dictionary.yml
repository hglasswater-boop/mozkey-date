name: Integrate English dictionary on current main

on:
  push:
    branches:
      - release/v0.2.1-english-dictionary

permissions:
  contents: write

concurrency:
  group: integrate-english-dictionary-v021
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch final English dictionary implementation
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin feature/english-word-dictionary:refs/remotes/origin/feature/english-word-dictionary --no-tags
          git checkout origin/feature/english-word-dictionary -- \
            src/rewriter/BUILD.bazel \
            src/rewriter/english_word_dictionary_ESDB_LICENSE.txt \
            src/rewriter/english_word_dictionary_data.inc \
            src/rewriter/english_word_dictionary_rewriter.cc \
            src/rewriter/english_word_dictionary_rewriter.h \
            src/rewriter/english_word_dictionary_rewriter_test.cc \
            src/rewriter/gen_english_word_dictionary.py

      - name: Integrate with current main safely
        shell: bash
        run: |
          set -euxo pipefail
          python tools/integrate_english_dictionary_release.py

      - name: Format Bazel files and verify patch
        shell: bash
        run: |
          set -euxo pipefail
          go install github.com/bazelbuild/buildtools/buildifier@v0.0.0-20260904073137-eaa4d125b423
          "$(go env GOPATH)/bin/buildifier" src/rewriter/BUILD.bazel
          python -m py_compile src/rewriter/gen_english_word_dictionary.py
          grep -q 'use_english_word_dictionary = 1029' src/protocol/config.proto
          grep -q 'use_english_spelling_correction = 1030' src/protocol/config.proto
          grep -q 'date_conversion_custom_formats_initialized = 1028' src/protocol/config.proto
          grep -q 'EnglishWordDictionaryRewriter' src/rewriter/rewriter.cc
          grep -q 'englishWordDictionaryCheckBox' src/gui/config_dialog/config_dialog.cc
          grep -q 'Test English word dictionary' .github/workflows/windows.yaml
          git diff --check

      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/integrate-english-dictionary.yml
          rm tools/integrate_english_dictionary_release.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate English word dictionary on current main"
          git push origin HEAD:release/v0.2.1-english-dictionary
