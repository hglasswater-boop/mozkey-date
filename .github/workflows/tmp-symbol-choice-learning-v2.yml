name: Temporary live symbol choice learning validation

on:
  push:
    branches:
      - feature/symbol-choice-learning

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/symbol-choice-learning

      - name: Implement symbol-choice learning and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path("src/rewriter/user_segment_history_rewriter.cc")
          text = source.read_text(encoding="utf-8")

          replacement = (
              "  const bool is_prediction_or_suggestion =\n"
              "      request.request_type() == ConversionRequest::PREDICTION ||\n"
              "      request.request_type() == ConversionRequest::SUGGESTION ||\n"
              "      request.request_type() == ConversionRequest::PARTIAL_PREDICTION ||\n"
              "      request.request_type() == ConversionRequest::PARTIAL_SUGGESTION;\n"
              "  if (request.request_type() != ConversionRequest::CONVERSION &&\n"
              "      !is_prediction_or_suggestion) {\n"
              "    return;\n"
              "  }\n\n"
              "  // Prediction/suggestion commits are normally learned by the predictor,\n"
              "  // not by UserSegmentHistoryRewriter. A user-selected symbol is a special\n"
              "  // case because symbol ordering is produced by rewriters. Remember only\n"
              "  // an explicit reranked symbol choice from these request types.\n"
              "  const bool learn_reranked_symbol_choice_only =\n"
              "      request.request_type() != ConversionRequest::CONVERSION;"
          )
          text, count = re.subn(
              r"  if \(request\.request_type\(\) != ConversionRequest::CONVERSION\) \{\n"
              r"    return;\n"
              r"  \}",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Finish prologue replacements: {count}")

          old = (
              "  const Segments target_segments =\n"
              "      UseInnerSegments(request)\n"
              "          ? MakeLearningSegmentsFromInnerSegments(request, segments)\n"
              "          : segments;\n"
          )
          new = (
              "  const Segments target_segments =\n"
              "      UseInnerSegments(request) && !learn_reranked_symbol_choice_only\n"
              "          ? MakeLearningSegmentsFromInnerSegments(request, segments)\n"
              "          : segments;\n"
          )
          if old not in text:
              raise SystemExit("target_segments block not found")
          text = text.replace(old, new, 1)

          anchor = (
              "    if (segment.candidates_size() <= 0 ||\n"
              "        segment.segment_type() != Segment::FIXED_VALUE ||\n"
              "        segment.candidate(0).attributes &\n"
              "            converter::Attribute::NO_HISTORY_LEARNING) {\n"
              "      continue;\n"
              "    }\n"
          )
          replacement = anchor + (
              "\n"
              "    if (learn_reranked_symbol_choice_only &&\n"
              "        (!(segment.candidate(0).attributes &\n"
              "           converter::Attribute::RERANKED) ||\n"
              "         segment.candidate(0).category != converter::Candidate::SYMBOL)) {\n"
              "      continue;\n"
              "    }\n"
          )
          if anchor not in text:
              raise SystemExit("Finish segment filter not found")
          text = text.replace(anchor, replacement, 1)
          source.write_text(text, encoding="utf-8")

          test_path = Path("src/rewriter/user_segment_history_rewriter_test.cc")
          tests = test_path.read_text(encoding="utf-8")
          new_tests = textwrap.dedent(r'''

          TEST_F(UserSegmentHistoryRewriterTest, LearnsSlashForMiddleDotSymbolKey) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest convreq = CreateConversionRequest();
            auto init_symbol_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("・");

              converter::Candidate* middle_dot = segment->add_candidate();
              middle_dot->key = "・";
              middle_dot->content_key = "・";
              middle_dot->value = "・";
              middle_dot->content_value = "・";
              middle_dot->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* slash = segment->add_candidate();
              slash->key = "・";
              slash->content_key = "・";
              slash->value = "/";
              slash->content_value = "/";
              slash->category = converter::Candidate::SYMBOL;
            };

            init_symbol_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(convreq, segments);

            init_symbol_candidates();
            EXPECT_TRUE(rewriter->Rewrite(convreq, &segments));
            EXPECT_EQ(segments.segment(0).candidate(0).value, "/");
            EXPECT_TRUE(segments.segment(0).candidate(0).attributes &
                        converter::Attribute::USER_SEGMENT_HISTORY_REWRITER);
          }

          TEST_F(UserSegmentHistoryRewriterTest,
                 LearnsRerankedSymbolChoiceFromPredictionCommit) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest prediction_request =
                ConversionRequestBuilder()
                    .SetConfig(*config_)
                    .SetRequest(*request_)
                    .SetOptions({.request_type = ConversionRequest::PREDICTION})
                    .Build();

            auto init_symbol_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("・");

              converter::Candidate* middle_dot = segment->add_candidate();
              middle_dot->key = "・";
              middle_dot->content_key = "・";
              middle_dot->value = "・";
              middle_dot->content_value = "・";
              middle_dot->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* slash = segment->add_candidate();
              slash->key = "・";
              slash->content_key = "・";
              slash->value = "/";
              slash->content_value = "/";
              slash->category = converter::Candidate::SYMBOL;
            };

            init_symbol_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(prediction_request, segments);

            init_symbol_candidates();
            EXPECT_TRUE(rewriter->Rewrite(prediction_request, &segments));
            EXPECT_EQ(segments.segment(0).candidate(0).value, "/");
          }

          TEST_F(UserSegmentHistoryRewriterTest,
                 DoesNotLearnNonSymbolFromPredictionCommit) {
            Segments segments;
            std::unique_ptr<UserSegmentHistoryRewriter> rewriter(
                CreateUserSegmentHistoryRewriter());
            rewriter->Clear();

            const ConversionRequest prediction_request =
                ConversionRequestBuilder()
                    .SetConfig(*config_)
                    .SetRequest(*request_)
                    .SetOptions({.request_type = ConversionRequest::PREDICTION})
                    .Build();

            auto init_candidates = [&]() {
              segments.Clear();
              Segment* segment = segments.add_segment();
              segment->set_key("test");

              converter::Candidate* first = segment->add_candidate();
              first->key = "test";
              first->content_key = "test";
              first->value = "first";
              first->content_value = "first";
              first->attributes |= converter::Attribute::BEST_CANDIDATE;

              converter::Candidate* second = segment->add_candidate();
              second->key = "test";
              second->content_key = "test";
              second->value = "second";
              second->content_value = "second";
            };

            init_candidates();
            segments.mutable_segment(0)->move_candidate(1, 0);
            segments.mutable_segment(0)->mutable_candidate(0)->attributes |=
                converter::Attribute::RERANKED;
            segments.mutable_segment(0)->set_segment_type(Segment::FIXED_VALUE);
            rewriter->Finish(prediction_request, segments);

            init_candidates();
            rewriter->Rewrite(prediction_request, &segments);
            EXPECT_EQ(segments.segment(0).candidate(0).value, "first");
          }
          ''')
          marker = "\n}  // namespace mozc\n"
          if "LearnsSlashForMiddleDotSymbolKey" not in tests:
              if marker not in tests:
                  raise SystemExit("namespace marker not found")
              tests = tests.replace(marker, new_tests + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run targeted history test
        working-directory: src
        run: bazelisk test //rewriter:user_segment_history_rewriter_test -c dbg

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-symbol-choice-learning-v2.yml
          git rm -f .github/tmp-symbol-learning-trigger.txt || true
          git add src/rewriter/user_segment_history_rewriter.cc src/rewriter/user_segment_history_rewriter_test.cc
          git commit -m "Learn explicit symbol choices from live conversion"
          git push origin HEAD:feature/symbol-choice-learning
