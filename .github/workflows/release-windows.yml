name: Publish Windows release

on:
  workflow_run:
    workflows:
      - CI for Windows
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI for Windows run ID containing the universal MSI
        required: true
        type: string
      release_tag:
        description: Release tag, for example v0.2.3
        required: true
        type: string
      release_sha:
        description: Commit SHA the release tag must resolve to
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows-${{ inputs.release_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release_tag.outputs.should_release }}
      tag: ${{ steps.release_tag.outputs.tag }}
      target_sha: ${{ steps.context.outputs.target_sha }}
      target_run_id: ${{ steps.context.outputs.target_run_id }}

    steps:
      - name: Resolve release context
        id: context
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target_run_id="$DISPATCH_RUN_ID"
            target_sha="$DISPATCH_SHA"
            requested_tag="$DISPATCH_TAG"

            [[ "$target_run_id" =~ ^[0-9]+$ ]] || {
              echo "run_id must be numeric: $target_run_id" >&2
              exit 1
            }
            [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "release_sha must be a full lowercase commit SHA: $target_sha" >&2
              exit 1
            }
            [[ "$requested_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "release_tag must be vX.Y.Z: $requested_tag" >&2
              exit 1
            }
          else
            target_run_id="$EVENT_RUN_ID"
            target_sha="$EVENT_RUN_SHA"
            requested_tag=""
          fi

          echo "target_run_id=$target_run_id" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "requested_tag=$requested_tag" >> "$GITHUB_OUTPUT"
          echo "Release context: event=$GITHUB_EVENT_NAME run=$target_run_id sha=$target_sha tag=${requested_tag:-auto}"

      - name: Verify candidate Windows CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.context.outputs.target_run_id }}
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
          run_name="$(jq -r '.name' <<<"$run_json")"
          run_path="$(jq -r '.path' <<<"$run_json")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_status="$(jq -r '.status' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          run_event="$(jq -r '.event' <<<"$run_json")"

          [[ "$run_name" == "CI for Windows" && "$run_path" == ".github/workflows/windows.yaml" ]] || {
            echo "run_id does not identify CI for Windows: name=$run_name path=$run_path" >&2
            exit 1
          }
          [[ "$run_sha" == "$TARGET_SHA" ]] || {
            echo "Candidate run SHA mismatch: expected=$TARGET_SHA actual=$run_sha" >&2
            exit 1
          }
          [[ "$run_status" == "completed" && "$run_conclusion" == "success" ]] || {
            echo "Candidate Windows CI has not succeeded: status=$run_status conclusion=$run_conclusion" >&2
            exit 1
          }
          [[ "$run_event" == "workflow_dispatch" || "$run_event" == "push" ]] || {
            echo "Unexpected candidate Windows CI event: $run_event" >&2
            exit 1
          }

          artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100" | jq '[.artifacts[] | select(.name == "Mozc64_universal.msi" and (.expired | not))] | length')"
          [[ "$artifact_count" == "1" ]] || {
            echo "Expected exactly one unexpired Mozc64_universal.msi artifact, found $artifact_count" >&2
            exit 1
          }

          echo "Verified successful Windows CI run $TARGET_RUN_ID for $TARGET_SHA with one universal MSI artifact."

      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.context.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find and verify release tag
        id: release_tag
        shell: bash
        env:
          TARGET_SHA: ${{ steps.context.outputs.target_sha }}
          REQUESTED_TAG: ${{ steps.context.outputs.requested_tag }}
        run: |
          set -euo pipefail

          matches=()
          while IFS= read -r ref; do
            [[ -n "$ref" ]] || continue
            resolved="$(git rev-list -n 1 "$ref")"
            if [[ "$resolved" == "$TARGET_SHA" ]]; then
              matches+=("${ref#refs/tags/}")
            fi
          done < <(git for-each-ref --format='%(refname)' 'refs/tags/v*')

          if (( ${#matches[@]} == 0 )); then
            if [[ -n "$REQUESTED_TAG" ]]; then
              echo "Requested release tag $REQUESTED_TAG does not point at $TARGET_SHA." >&2
              exit 1
            fi
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No v* tag points at $TARGET_SHA; nothing to publish."
            exit 0
          fi

          if (( ${#matches[@]} != 1 )); then
            printf 'Multiple v* tags point at %s: %s\n' "$TARGET_SHA" "${matches[*]}" >&2
            exit 1
          fi

          tag="${matches[0]}"
          if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$tag" ]]; then
            echo "Requested tag mismatch: requested=$REQUESTED_TAG resolved=$tag" >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing $tag from $TARGET_SHA"

      - name: Verify release version metadata
        if: steps.release_tag.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail

          expected="${RELEASE_TAG#v}"
          major="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MAJOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          minor="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MINOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          patch="$(sed -n 's/^MOZKEY_RELEASE_VERSION_PATCH = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          actual="${major}.${minor}.${patch}"

          [[ "$actual" == "$expected" ]] || {
            echo "Release tag/version mismatch: tag=$RELEASE_TAG source=v$actual" >&2
            exit 1
          }

          grep -Fq 'MOZKEY_MSI_PRODUCT_VERSION' src/version.bzl || {
            echo "mozkey-date MSI ProductVersion mapping is missing" >&2
            exit 1
          }
          grep -Fq 'Version::GetMozkeyReleaseVersion()' src/gui/about_dialog/about_dialog.cc || {
            echo "About dialog is not using the mozkey-date release version" >&2
            exit 1
          }
          grep -Fq 'Invoke-WebRequest -UseBasicParsing' src/gui/about_dialog/about_dialog.cc || {
            echo "About updater bootstrap is not Windows PowerShell 5.1-safe" >&2
            exit 1
          }
          grep -Fq 'english_word_dictionary_rewriter' src/rewriter/rewriter.cc || {
            echo "English word dictionary is missing from the release commit" >&2
            exit 1
          }
          grep -Fq 'dateConversionFormatListWidget' src/gui/config_dialog/config_dialog.cc || {
            echo "Date conversion settings UI is missing from the release commit" >&2
            exit 1
          }
          grep -Fq 'REINSTALL=ALL' tools/windows/update-mozkey-date.ps1 || {
            echo "Updater same-release repair handling is missing" >&2
            exit 1
          }
          grep -Fq 'if ($Force -and $installedTag -eq $tag)' tools/windows/update-mozkey-date.ps1 || {
            echo "Updater does not guard REINSTALL behind same-release -Force repair" >&2
            exit 1
          }
          test -f tools/windows/test-msi-major-upgrade.ps1 || {
            echo "MSI major-upgrade verification script is missing" >&2
            exit 1
          }

  verify_upgrade:
    needs: metadata
    if: needs.metadata.outputs.should_release == 'true'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}
          persist-credentials: false

      - name: Download candidate universal Windows MSI
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_universal.msi
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.metadata.outputs.target_run_id }}

      - name: Download previous released Windows MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "mozkey-date-release-upgrade-gate"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=50" -Headers $headers
          $previous = $releases |
            Where-Object {
              -not $_.draft -and
              -not $_.prerelease -and
              $_.tag_name -ne $env:RELEASE_TAG
            } |
            Select-Object -First 1

          if (-not $previous) {
            throw "No previous stable GitHub Release is available for the upgrade test."
          }

          $asset = $previous.assets |
            Where-Object { $_.name -eq "MozkeyDate-Windows.msi" } |
            Select-Object -First 1
          if (-not $asset) {
            throw "Previous release '$($previous.tag_name)' has no MozkeyDate-Windows.msi asset."
          }

          New-Item -ItemType Directory -Path previous-release -Force | Out-Null
          $downloadHeaders = $headers.Clone()
          $downloadHeaders["Accept"] = "application/octet-stream"
          Invoke-WebRequest -UseBasicParsing -Uri $asset.url -Headers $downloadHeaders -OutFile "previous-release\MozkeyDate-Windows.msi"

          Write-Host "Upgrade baseline: $($previous.tag_name)"

      - name: Verify previous MSI is replaced by candidate MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\tools\windows\test-msi-major-upgrade.ps1 -PreviousMsi ".\previous-release\MozkeyDate-Windows.msi" -CandidateMsi ".\candidate\Mozc64.msi" -LogDirectory ".\upgrade-logs"

      - name: Upload MSI upgrade logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-msi-upgrade-logs-${{ needs.metadata.outputs.tag }}
          path: upgrade-logs
          if-no-files-found: ignore

  publish:
    needs:
      - metadata
      - verify_upgrade
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.should_release == 'true' &&
      needs.verify_upgrade.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag remains immutable
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          [[ "$actual_sha" == "$TARGET_SHA" ]] || {
            echo "Release tag moved: tag=$RELEASE_TAG expected=$TARGET_SHA actual=$actual_sha" >&2
            exit 1
          }

      - name: Download universal Windows MSI from verified run
        uses: actions/download-artifact@v6
        with:
          name: Mozc64_universal.msi
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.metadata.outputs.target_run_id }}

      - name: Verify MSI ProductVersion and UpgradeCode
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y msitools >/dev/null

          major="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MAJOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          minor="$(sed -n 's/^MOZKEY_RELEASE_VERSION_MINOR = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          patch="$(sed -n 's/^MOZKEY_RELEASE_VERSION_PATCH = \([0-9][0-9]*\)$/\1/p' src/version.bzl)"
          expected_product_version="$((100 + major)).${minor}.${patch}"
          expected_upgrade_code="DD94B570-B5E2-4100-9D42-61930C611D8A"

          property_table="$(msiinfo export release/Mozc64.msi Property | tr -d '\r')"
          product_version="$(printf '%s\n' "$property_table" | awk -F '\t' '$1 == "ProductVersion" {print $2; exit}')"
          [[ "$product_version" == "$expected_product_version" ]] || {
            echo "MSI ProductVersion mismatch: expected=$expected_product_version actual=$product_version" >&2
            exit 1
          }

          upgrade_table="$(msiinfo export release/Mozc64.msi Upgrade | tr -d '\r')"
          printf '%s\n' "$upgrade_table" | grep -qi "$expected_upgrade_code" || {
            echo "MSI UpgradeCode mismatch: expected $expected_upgrade_code" >&2
            exit 1
          }

          echo "Verified MSI ProductVersion=$product_version and UpgradeCode=$expected_upgrade_code"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          source="release/Mozc64.msi"
          installer="release/MozkeyDate-Windows.msi"
          checksum="${installer}.sha256"

          [[ -f "$source" ]] || {
            echo "Universal MSI was not found: $source" >&2
            exit 1
          }

          mv "$source" "$installer"
          hash="$(sha256sum "$installer" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$(basename "$installer")" > "$checksum"
          echo "Release MSI SHA-256: $hash"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          assets=(
            "release/MozkeyDate-Windows.msi"
            "release/MozkeyDate-Windows.msi.sha256"
            "tools/windows/update-mozkey-date.ps1"
            "tools/windows/update-mozkey-date.cmd"
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mozkey Date $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
