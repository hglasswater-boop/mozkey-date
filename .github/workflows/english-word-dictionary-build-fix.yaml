name: Fix English rewriter Bazel wiring

on:
  push:
    branches:
      - feature/english-word-dictionary

permissions:
  contents: write

jobs:
  fix_build_dep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add aggregate rewriter dependency
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/rewriter/BUILD.bazel')
          text = path.read_text(encoding='utf-8')
          target = text.index('    name = "rewriter",')
          anchor = '        ":english_variants_rewriter",\n'
          pos = text.index(anchor, target) + len(anchor)
          dep = '        ":english_word_dictionary_rewriter",\n'
          target_end = text.index('    alwayslink = 1,', target)
          if dep not in text[target:target_end]:
              text = text[:pos] + dep + text[pos:]
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- src/rewriter/BUILD.bazel; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rewriter/BUILD.bazel
          git commit -m "Link English input rewriter into aggregate target"
          git push origin HEAD:feature/english-word-dictionary
