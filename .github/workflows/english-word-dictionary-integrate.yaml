name: Integrate English input assistance on current main

on:
  push:
    branches:
      - feature/english-word-dictionary-main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main based branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch validated English feature source
        shell: bash
        run: git fetch origin feature/english-word-dictionary:refs/remotes/origin/feature/english-word-dictionary

      - name: Reapply English input assistance to current main
        shell: bash
        run: python .github/scripts/integrate_english_dictionary.py

      - name: Verify patch cleanliness
        shell: bash
        run: |
          git diff --check
          grep -n "date_conversion_custom_formats_initialized = 1028" src/protocol/config.proto
          grep -n "use_english_word_dictionary = 1029" src/protocol/config.proto
          grep -n "use_english_spelling_correction = 1030" src/protocol/config.proto
          grep -n "EnglishWordDictionaryRewriter" src/rewriter/rewriter.cc

      - name: Commit clean integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol/config.proto \
                  src/gui/config_dialog/config_dialog.cc \
                  src/gui/config_dialog/config_dialog.h \
                  src/rewriter/BUILD.bazel \
                  src/rewriter/rewriter.cc \
                  src/rewriter/english_word_dictionary_ESDB_LICENSE.txt \
                  src/rewriter/english_word_dictionary_data.inc \
                  src/rewriter/english_word_dictionary_rewriter.cc \
                  src/rewriter/english_word_dictionary_rewriter.h \
                  src/rewriter/english_word_dictionary_rewriter_test.cc \
                  src/rewriter/gen_english_word_dictionary.py
          git commit -m "Add English input assistance on current main"
          git push origin HEAD:feature/english-word-dictionary-main
